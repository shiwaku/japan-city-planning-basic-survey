# CKAN API を持たない配布サイトの登録簿。`python -m bskp scrape` が読む。
#
#   id / name / prefecture : 出力の catalog_id・organization になる
#   start_urls : 最初に読むページ（複数可）
#   follow     : このパターンに一致するリンクを「次に読むページ」として1段だけ辿る
#   match      : リンクURLかリンクテキストがこれに一致するものだけ採用（省略時は拡張子のみで判定）
#   pause      : 1リクエストごとの待ち時間（秒）
#   license    : 分かっていれば書く。resources.csv の license 列に入る
#
# robots.txt は scrape 側が必ず確認し、禁止されていれば取得しない。
# 無制限クロールはしない（follow は 1 段のみ）。

sites:
  - id: hiroshima-dobox
    name: ひろしま DoboX データカタログ
    prefecture: 広島県
    start_urls:
      - https://hiroshima-dobox.jp/datasets_condition
    match: 都市計画|土地利用|建物|基礎調査
    pause: 1.5
    enabled: false
    note: >
      匿名では取得不可のため無効化。CKAN API は無く、内部APIの /api/datasets は
      401 {"errors":"認証エラー"} を返す。データカタログ画面の <a> 54個は
      すべてナビゲーションで、一覧は動的描画。ダウンロードにアカウントが要る。
      robots.txt 自体は Disallow 空（全許可）なので、規約上の可否を確認したうえで
      認証情報を用意すれば対象にできる。

  - id: mlit-kisochosa
    name: 国土交通省 都市計画基礎調査情報のオープン化
    prefecture: 全国
    start_urls:
      - https://www.mlit.go.jp/toshi/city_plan/toshi_city_plan_tk_000049.html
      - https://www.mlit.go.jp/toshi/tosiko/kisotyousa001.html
    pause: 1.0
    enabled: true
    license: 出典明示（国土交通省）
    note: >
      実データではなく、様式テンプレートCSV・コード表XLSX・実施要領PDF。
      変換フェーズの列マッピング（lui_201 等）とコード対照に使う。


  - id: tsushima
    name: 津島市 都市計画関連情報のオープンデータ
    prefecture: 愛知県津島市
    start_urls:
      - https://www.city.tsushima.lg.jp/kurashi/sumaikenchiku/toshikeikaku/tokeiopendeta.html
    pause: 1.0
    enabled: true
    note: 市の通常ページから SHP の ZIP を直接配布している型。この型は全国に多数ある

  - id: kawasaki
    name: 川崎市 都市計画基礎調査（オープンデータ）
    prefecture: 神奈川県川崎市
    start_urls:
      - https://www.city.kawasaki.jp/500/page/0000185069.html
    pause: 1.0
    enabled: true

  - id: isehara
    name: 伊勢原市 オープンデータ（神奈川県都市計画基礎調査）
    prefecture: 神奈川県伊勢原市
    start_urls:
      - https://www.city.isehara.kanagawa.jp/docs/2026022500029/
    pause: 1.0
    enabled: true

  - id: nakatsugawa
    name: 中津川市 都市計画基礎調査データの閲覧
    prefecture: 岐阜県中津川市
    start_urls:
      - https://www.city.nakatsugawa.lg.jp/soshikikarasagasu/toshikeikakuka/3/4/27125.html
    pause: 1.0
    enabled: false
    note: >
      0件だが取りこぼしではない。実体は岐阜県オープンデータカタログ
      （gifu-opendata.pref.gifu.lg.jp/dataset/c11654-039）にあり、そちらで収集済み。

  - id: azumino
    name: 安曇野市 オープンデータ（都市計画関連情報）
    prefecture: 長野県安曇野市
    start_urls:
      - https://www.city.azumino.nagano.jp/site/kaihatsu/109027.html
    pause: 1.0
    enabled: true

  - id: saitama-city
    name: さいたま市 都市計画基礎調査結果のオープンデータ公開
    prefecture: 埼玉県さいたま市
    start_urls:
      - https://www.city.saitama.lg.jp/001/010/014/002/p097965.html
    pause: 1.0
    enabled: false
    note: >
      0件だが取りこぼしではない。実体は G空間情報センターの
      saitamacity-toshikeikaku_r2 にあり、そちらで収集済み。

  - id: saitama-pref
    name: 埼玉県 都市計画情報オープンデータ
    prefecture: 埼玉県
    start_urls:
      - https://www.pref.saitama.lg.jp/a1102/tosikeikaku-data/index.html
    follow: /a1102/tosikeikaku-data/
    pause: 1.0
    enabled: true
    note: さいたま市のページからの被リンクで発見。県の通常ページから直接配布する型
