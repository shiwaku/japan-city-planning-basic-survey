<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>都市計画基礎調査ビューア</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --line: #d8d8d8;
    --panel: rgba(255,255,255,.94); --shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --fg: #e8e8e8; --muted: #9aa0a6; --line: #33363b;
      --panel: rgba(22,24,28,.94); --shadow: 0 2px 12px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #map { position: absolute; inset: 0; }

  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1; width: 260px;
    max-height: calc(100% - 20px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: var(--shadow); padding: 12px 14px; font-size: 13px;
  }
  #panel h1 { font-size: 14px; margin: 0 0 2px; }
  #panel .sub { color: var(--muted); font-size: 11px; margin-bottom: 10px; line-height: 1.5; }
  .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .row label { flex: 1; cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .swatch { width: 11px; height: 11px; border-radius: 2px; flex: none; }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
  #info {
    position: absolute; right: 10px; bottom: 26px; z-index: 1; width: 300px;
    max-height: 45%; overflow-y: auto; display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: var(--shadow); padding: 10px 12px; font-size: 12px;
  }
  #info table { border-collapse: collapse; width: 100%; }
  #info th, #info td { text-align: left; padding: 2px 6px 2px 0; vertical-align: top;
    border-bottom: 1px solid var(--line); word-break: break-all; }
  #info th { color: var(--muted); font-weight: 400; white-space: nowrap; }
  #status { color: var(--muted); font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <h1>都市計画基礎調査</h1>
  <div class="sub">都市計画法第6条に基づく法定調査のオープンデータ。<br>凡例をクリックで表示切替、地物クリックで属性表示。</div>
  <div id="layers"></div>
  <div id="status">読み込み中…</div>
</div>

<div id="info"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<script>
// 調査項目ごとに 1 つの PMTiles を作ってある（bskp tiles が生成）。
// 色は項目の意味に合わせた固定割り当て。
const THEMES = [
  { slug: 'landuse',    label: '土地利用', color: '#e8a33d' },
  { slug: 'building',   label: '建物',     color: '#c2453f' },
  { slug: 'population', label: '人口',     color: '#4a7fb5' },
  { slug: 'industry',   label: '産業',     color: '#8a5fa8' },
  { slug: 'facility',   label: '都市施設', color: '#3f8f7a' },
  { slug: 'landprice',  label: '地価',     color: '#b5843f' },
  { slug: 'nature',     label: '自然環境', color: '#5a9e4a' },
  { slug: 'hazard',     label: '災害',     color: '#d4643c' },
  { slug: 'landscape',  label: '景観',     color: '#7a7fa8' },
  { slug: 'other',      label: 'その他',   color: '#8b8b8b' },
];
// 既定で表示するもの。全部出すと重なって読めないので基礎調査の中心項目だけ。
const DEFAULT_ON = new Set(['landuse', 'building']);

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

const map = new maplibregl.Map({
  container: 'map',
  hash: true,
  center: [137.5, 34.9],
  zoom: 8,
  style: {
    version: 8,
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: {
      gsi: {
        type: 'raster',
        tiles: ['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'],
        tileSize: 256,
        maxzoom: 18,
        attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>',
      },
    },
    layers: [{ id: 'basemap', type: 'raster', source: 'gsi' }],
  },
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'metric' }));

const layersEl = document.getElementById('layers');
const statusEl = document.getElementById('status');
const infoEl = document.getElementById('info');

async function boot() {
  let index = [];
  try {
    index = await (await fetch('../data/tiles/index.json')).json();
  } catch (err) {
    statusEl.textContent = 'index.json を読めません。bskp tiles を実行してから、'
      + 'リポジトリ直下で scripts/serve.py を起動してください。';
    return;
  }
  const available = new Map(index.map(e => [e.slug, e]));
  const interactive = [];

  await map.once('load');

  for (const theme of THEMES) {
    const entry = available.get(theme.slug);
    if (!entry) continue;

    const src = `src-${theme.slug}`;
    map.addSource(src, { type: 'vector', url: `pmtiles://../data/tiles/${theme.slug}.pmtiles` });
    const visible = DEFAULT_ON.has(theme.slug) ? 'visible' : 'none';

    // ジオメトリ型が混在するので面・線・点の3レイヤを重ねる。
    // MVT側の $type でフィルタすれば、型ごとに描き分けられる。
    map.addLayer({
      id: `${theme.slug}-fill`, type: 'fill', source: src, 'source-layer': theme.slug,
      filter: ['==', ['geometry-type'], 'Polygon'],
      layout: { visibility: visible },
      paint: { 'fill-color': theme.color, 'fill-opacity': 0.35,
               'fill-outline-color': theme.color },
    });
    map.addLayer({
      id: `${theme.slug}-line`, type: 'line', source: src, 'source-layer': theme.slug,
      filter: ['==', ['geometry-type'], 'LineString'],
      layout: { visibility: visible },
      paint: { 'line-color': theme.color, 'line-width': 1.4 },
    });
    map.addLayer({
      id: `${theme.slug}-point`, type: 'circle', source: src, 'source-layer': theme.slug,
      filter: ['==', ['geometry-type'], 'Point'],
      layout: { visibility: visible },
      paint: { 'circle-radius': 3.5, 'circle-color': theme.color,
               'circle-stroke-width': 1, 'circle-stroke-color': '#fff' },
    });
    interactive.push(`${theme.slug}-fill`, `${theme.slug}-line`, `${theme.slug}-point`);

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <label>
        <input type="checkbox" ${visible === 'visible' ? 'checked' : ''}>
        <span class="swatch" style="background:${theme.color}"></span>
        <span>${theme.label}</span>
      </label>
      <span class="count">${entry.layers}</span>`;
    row.querySelector('input').addEventListener('change', (ev) => {
      const v = ev.target.checked ? 'visible' : 'none';
      for (const suffix of ['fill', 'line', 'point']) {
        map.setLayoutProperty(`${theme.slug}-${suffix}`, 'visibility', v);
      }
    });
    layersEl.appendChild(row);
  }

  const totalLayers = index.reduce((a, e) => a + e.layers, 0);
  statusEl.textContent = `${index.length} 項目 / ${totalLayers} レイヤ`;

  map.on('click', (ev) => {
    const hits = map.queryRenderedFeatures(ev.point, { layers: interactive });
    if (!hits.length) { infoEl.style.display = 'none'; return; }
    const f = hits[0];
    const rows = Object.entries(f.properties)
      .filter(([, v]) => v !== null && v !== '')
      .map(([k, v]) => `<tr><th>${escapeHtml(k)}</th><td>${escapeHtml(String(v))}</td></tr>`)
      .join('');
    infoEl.innerHTML = `<table>${rows || '<tr><td>属性なし</td></tr>'}</table>`;
    infoEl.style.display = 'block';
  });

  map.on('mouseenter', interactive[0], () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', interactive[0], () => { map.getCanvas().style.cursor = ''; });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

boot();
</script>
</body>
</html>
