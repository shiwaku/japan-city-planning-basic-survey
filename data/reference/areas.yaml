# レイヤ名から対象自治体を拾うための規則。
#
# 自治体はレイヤ名の付け方を揃えていないので、一般則だけでは拾えない。
# 拾えたぶんは patterns で、拾えないぶんは datasets で名前を与える。
# どちらにも当たらなければレイヤ名をそのまま出す（黙って落とさない）。
#
# `bskp tiles` が data/tiles/areas.json を書くときに使う。

# レイヤ名に自治体名が入っている型。最初に当たったものを採る
patterns:
  # ①H23_土地利用_100_さいたま市 / H23_土地利用_203_川口市
  - '^[①-⑳]?H\d+_土地利用_\d+_(.+)$'
  # ①秩父市_土地利用
  - '^[①-⑳](.+?)_土地利用$'
  # 5-2土地利用現況_津島市
  - '^[\d\-]+土地利用現況_(.+)$'

# レイヤ名に自治体名が入っていないデータセット。
# name はデータセット全体、layers はレイヤごとに与える
datasets:
  # 東京都は市区町村ではなく調査ブロックごとに配布している。
  # 区部・多摩は年次も違う（R03 と R04）ので分けたまま出す
  t000008d2000000019:
    layers:
      R03土地利用現況: 区部全域（R03）
      R03建物現況: 区部全域（R03）
      R04土地利用現況_ウ多摩全域: 多摩全域（R04）
      R04建物現況_ウ多摩全域: 多摩全域（R04）
      R04土地利用現況（伊豆）: 伊豆諸島（R04）
      R04建物現況（伊豆）: 伊豆諸島（R04）
      R04土地利用現況（小笠原）: 小笠原諸島（R04）
      R04建物現況（小笠原）: 小笠原諸島（R04）

  # R02土地利用 / HouseR03。どちらも市全域
  saitamacity-toshikeikaku_r2:
    name: さいたま市

  # 島田市の建物利用現況調査。レイヤ名は kaoku（家屋）で自治体名が入らない。
  # 静岡県は建物利用現況を持たず、市町が調査して各自公開している（都市計画法
  # 第6条第3項）ので、県のデータセットとは別枠になっている
  135c1f13-4242-48c9-b0fc-fdc6885b07af:
    name: 島田市

  # 静岡県は自治体ごとにデータセットを分けており、レイヤ名はどれも tochiriyou。
  # shimizu は静岡市清水区ではなく駿東郡清水町（データセット名は
  # 「静岡県都市計画基礎調査（清水町）」、範囲も三島・沼津寄り）
  tosikeikaku202306shizuoka:
    name: 静岡市
  tosikeikaku202306shimizu:
    name: 清水町
