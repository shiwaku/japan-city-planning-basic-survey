# 国交省の対照表より優先する、publisher の一次資料に基づく土地利用コード表。
#
# 対照表（001406905.xlsx）は公式だが、実データと食い違うことがある。
# 版が古い／細分が載っていない／コード体系が変わっている、が実測で見つかった。
# 食い違ったときは publisher が自分のデータに同梱している定義書を正とする。
#
# ここに書くのは「一次資料に記載がある対応」だけ。推測は入れない。
# 各エントリに source を必ず書き、後から検証できるようにする。

overrides:
  静岡県:
    source: >
      静岡県都市計画基礎調査データ定義「GISフィールド定義書2.pdf」3-2)-(1) tochiriyou ※1
      （G空間情報センター tosikeikaku202306* の 00_共通/定義書 に同梱）
    reason: >
      国交省の対照表は平成30年度要綱に基づく 1〜16 だが、公開されている令和5年度
      データの実値は 10〜164 で 10 倍の体系。対照表のまま照合すると '10' が
      農林漁業施設用地(219) に写り、実際の「田」(201) と食い違う。
    to_national:
      '10': '201'    # 田
      '20': '202'    # 畑
      '30': '203'    # 山林
      '40': '204'    # 水面
      '50': '205'    # 自然地
      '60': '205'    # その他の自然的土地利用
      '70': '211'    # 住宅用地
      '80': '212'    # 商業用地
      '90': '213'    # 工業用地
      '100': '219'   # 農林漁業用施設用地
      '110': '214'   # 公益施設用地
      '120': '215'   # 道路用地
      '130': '216'   # 交通施設用地
      '140': '217'   # 公共空地
      '150': '218'   # その他の公的施設用地
      '161': '220'   # ゴルフ場（その他の空地①）
      '162': '221'   # 太陽光発電（その他の空地②）
      '163': '222'   # 平面駐車場（その他の空地③）
      '164': '223'   # 低利用地（その他の空地④）
